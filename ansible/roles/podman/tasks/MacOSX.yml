- name: "{{ role_name }} | MacOSX | Install Podman"
  community.general.homebrew:
    name: podman
    state: present
  when: ansible_distribution_major_version | int >= 13
- name: "{{ role_name }} | MacOSX | Install Podman-Desktop"
  community.general.homebrew_cask:
    name: podman-desktop
    state: present

- name: "Include main vars"
  ansible.builtin.include_vars:
    file: "../../../vars.yml"
- name: "Check for Zed Directory"
  ansible.builtin.stat:
    path: '{{ home }}/.config/zed'
  register: p
- name: "Create the Directory"
  shell: 'mkdir {{ home }}/.config/zed/'
  when: p.stat.isdir is not defined and not p.stat.isdir
- name: "Zed | MacOSX | Install"
  community.general.homebrew:
    name: zed
    state: present
- name: "Zed | MacOSX | Link Keymap"
  ansible.builtin.file:
    src: '{{ dots }}/zed/keymap.json'
    dest: '{{ home }}/.config/zed/keymap.json'
    owner: '{{ user }}'
    group: '{{ group }}'
    state: link
- name: "Zed | MacOSX | Link Settings"
  ansible.builtin.file:
    src: '{{ dots }}/zed/settings.json'
    dest: '{{ home }}/.config/zed/settings.json'
    owner: '{{ user }}'
    group: '{{ group }}'
    state: link

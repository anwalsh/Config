- name: "1Password | MacOSX | Is Installed?"
  ansible.builtin.command: "op --version"
  register: op_version_result
  changed_when: false
  failed_when: false
- name: "1Password | MacOSX | Install 1Password"
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
  loop:
    - 1password
    - 1password-cli
  when: op_version_result.rc != 0
